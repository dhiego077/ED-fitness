<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ED Fitness</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="site-wrap">
    <img src="assets/ed-fitness-layout.png" alt="Layout ED Fitness" class="layout-image">

    <a href="#colecao" class="hotspot hotspot-colecao" aria-label="Ver coleção"></a>
    <a href="#tops" class="hotspot hotspot-tops" aria-label="Ver Tops"></a>
    <a href="#leggings" class="hotspot hotspot-leggings" aria-label="Ver Leggings"></a>
    <a href="#blusas" class="hotspot hotspot-blusas" aria-label="Ver Blusas"></a>
    <a href="#acessorios" class="hotspot hotspot-acessorios" aria-label="Ver Acessórios"></a>
    <button type="button" class="hotspot hotspot-search" id="searchButton" aria-label="Buscar produtos"></button>
    <button type="button" class="hotspot hotspot-account" id="accountButton" aria-label="Minha conta"></button>
    <button type="button" class="hotspot hotspot-cart" id="cartButton" aria-label="Abrir carrinho">
      <span class="cart-count" id="cartCount">0</span>
    </button>
    <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" class="hotspot hotspot-instagram" aria-label="Instagram"></a>
    <a href="https://wa.me/5500000000000" target="_blank" rel="noopener noreferrer" class="hotspot hotspot-whatsapp" aria-label="WhatsApp"></a>

    <button type="button" class="hotspot product-hotspot product-1" data-product-id="1" aria-label="Adicionar Conjunto Essential ao carrinho"></button>
    <button type="button" class="hotspot product-hotspot product-2" data-product-id="2" aria-label="Adicionar Legging Move ao carrinho"></button>
    <button type="button" class="hotspot product-hotspot product-3" data-product-id="3" aria-label="Adicionar Top Energy ao carrinho"></button>
    <button type="button" class="hotspot product-hotspot product-4" data-product-id="4" aria-label="Adicionar Blusa Flow ao carrinho"></button>

    <section class="anchor-section" id="colecao" aria-hidden="true"></section>
    <section class="anchor-section" id="tops" aria-hidden="true"></section>
    <section class="anchor-section" id="leggings" aria-hidden="true"></section>
    <section class="anchor-section" id="blusas" aria-hidden="true"></section>
    <section class="anchor-section" id="acessorios" aria-hidden="true"></section>
  </main>

  <div class="cart-backdrop" id="cartBackdrop" hidden></div>
  <aside class="cart-drawer" id="cartDrawer" aria-hidden="true" aria-labelledby="cartTitle">
    <div class="cart-header">
      <div>
        <p class="cart-kicker">ED FITNESS</p>
        <h2 id="cartTitle">Seu carrinho</h2>
      </div>
      <button type="button" class="cart-close" id="cartClose" aria-label="Fechar carrinho">×</button>
    </div>

    <div class="cart-body" id="cartItems"></div>

    <div class="cart-footer">
      <div class="cart-total-row">
        <span>Total</span>
        <strong id="cartTotal">R$ 0,00</strong>
      </div>
      <button type="button" class="checkout-button" id="checkoutButton">Finalizar compra</button>
      <p class="cart-note">O pedido será enviado pelo WhatsApp da loja.</p>
    </div>
  </aside>

  <div class="modal-backdrop" id="modalBackdrop" hidden></div>
  <section class="simple-modal" id="searchModal" aria-hidden="true" aria-labelledby="searchTitle">
    <button type="button" class="modal-close" data-close-modal aria-label="Fechar">×</button>
    <h2 id="searchTitle">Buscar produtos</h2>
    <form id="searchForm">
      <label for="searchInput">Digite o nome do produto</label>
      <div class="search-row">
        <input id="searchInput" name="search" type="search" placeholder="Ex.: legging" autocomplete="off">
        <button type="submit">Buscar</button>
      </div>
    </form>
    <p id="searchResult" class="search-result"></p>
  </section>

  <section class="simple-modal" id="accountModal" aria-hidden="true" aria-labelledby="accountTitle">
    <button type="button" class="modal-close" data-close-modal aria-label="Fechar">×</button>
    <h2 id="accountTitle">Minha conta</h2>
    <p>Área demonstrativa pronta para receber login e cadastro real.</p>
  </section>

  <script src="script.js"></script>
</body>
</html>
